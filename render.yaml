services:
  - type: web
    name: dns-tunneling-detector-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CORS_ORIGINS
        value: "https://dns-tunneling-detector.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./data/dns_tunneling.db"
